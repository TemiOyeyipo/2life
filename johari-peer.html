<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Johari Window — Peer Response</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#142033; --paper:#F2F4F7; --white:#fff; --line:#D3D9E1; --muted:#586477;
    --ui:'Bricolage Grotesque', system-ui, sans-serif;
    --read:'Source Serif 4', Georgia, serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5}
  h1,h2,h3{font-weight:800;line-height:1.15;margin:0;letter-spacing:-.02em}
  p{margin:0 0 1em}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:var(--white)}
  .logo{height:34px;width:auto;display:block}
  main{max-width:820px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,40px)}
  footer{max-width:820px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 40px;color:var(--muted);font-size:14px}

  .btn{display:inline-block;border:0;border-radius:999px;padding:14px 28px;font-weight:700;background:var(--ink);color:#fff;min-height:48px}
  .btn[disabled]{opacity:.35;cursor:not-allowed}

  h1.page{font-size:clamp(30px,5.5vw,46px);margin-bottom:12px}
  .lede{font-family:var(--read);font-size:19px;color:#2b3850;max-width:38em}

  label{display:grid;gap:6px;font-weight:600;font-size:15px;max-width:320px;margin-bottom:20px}
  select,input{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
  .fine{font-size:14px;color:var(--muted);margin:0}
  .err{color:#B3261E;font-weight:600;min-height:1.4em;margin:0}

  .center{text-align:center;padding:60px 0}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto 16px;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .wordgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));gap:8px;margin:16px 0}
  .wordgrid label{display:flex;align-items:center;font-size:13.5px;font-weight:500;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff;max-width:none;margin:0}
  .wordgrid label.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .wordgrid input{margin-right:6px;min-height:auto}
  .wcount{font-size:14px;color:var(--muted);margin-bottom:8px}
  .wcount.over{color:#B3261E;font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <svg class="logo" viewBox="0 0 540 120" role="img" aria-label="L'chaim: Nourishing Life &amp; Spirit">
      <g transform="translate(10, 0)">
        <path d="M 55 18 L 55 10 M 39 24 L 34 19 M 71 24 L 76 19 M 28 40 L 20 38 M 82 40 L 90 38"
              stroke="#D4A359" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
        <path d="M 30 65 A 28 28 0 1 1 80 65"
              fill="none" stroke="#2C3E35" stroke-width="3.8" stroke-linecap="round"/>
        <path d="M 55 38 C 36 55 32 78 55 94 C 78 78 74 55 55 38 Z" fill="#4A6B5D" opacity="0.95"/>
        <path d="M 55 94 C 50 81 50 65 55 54 C 60 65 60 81 55 94 Z" fill="#C87D55"/>
      </g>
      <text x="125" y="66" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="700" letter-spacing="2.8" fill="#2C3E35">L'chaim</text>
      <text x="127" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.5" fill="#C87D55" opacity="0.95">NOURISHING LIFE &amp; SPIRIT</text>
    </svg>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer>
  Your individual answers are never shown to anyone individually — only combined with other colleagues' responses.
</footer>

<script src="config.js"></script>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call = (fn, params) => fetch(CONFIG.API_URL, {
  method: 'POST',
  body: JSON.stringify({ fn, ...(params || {}) })
})
  .then(res => res.json())
  .then(data => {
    if (!data || !data.ok) throw new Error((data && data.error) || 'Something went wrong. Please try again.');
    return data.data;
  })
  .catch(err => { throw new Error(err.message || 'Could not reach the server. Please try again.'); });

const params = new URLSearchParams(window.location.search);
const sessionId = params.get('s') || '';
const selected = new Set();
let ADJ = [], MIN = 4, MAX = 8;

function loading(text) {
  app.innerHTML = `<div class="center"><div class="spin"></div><p>${esc(text)}</p></div>`;
}

function updateWcount() {
  const el = $('#wcount');
  if (!el) return;
  const n = selected.size;
  el.textContent = `Choose ${MIN}\u2013${MAX} words: ${n} selected`;
  el.classList.toggle('over', n > MAX);
  const btn = $('#submitBtn');
  if (btn) btn.disabled = n < MIN || n > MAX;
}

async function boot() {
  if (!sessionId) {
    app.innerHTML = `<h1 class="page">Link not valid</h1><p class="lede">This peer link is missing its session. Ask whoever invited you for a fresh link.</p>`;
    return;
  }

  loading('Loading');
  try {
    const [info, adjData] = await Promise.all([
      call('johariSessionInfo', { sessionId }),
      call('johariGetAdjectives')
    ]);
    ADJ = adjData.adjectives; MIN = adjData.min; MAX = adjData.max;
    renderForm(info);
  } catch (e) {
    app.innerHTML = `<h1 class="page">Link not valid</h1><p class="lede">${esc(e.message)}</p>`;
  }
}

function renderForm(info) {
  app.innerHTML = `
    <h1 class="page">Describe ${esc(info.firstName || 'your colleague')}</h1>
    <p class="lede">Pick ${MIN}\u2013${MAX} words below that best describe ${esc(info.firstName || 'this person')}. Answer honestly — your individual picks are never shown to anyone by name.</p>

    <label>Your relationship to them
      <select id="relationship">
        <option>Manager</option>
        <option>Direct report</option>
        <option selected>Peer / colleague</option>
        <option>Friend</option>
        <option>Other</option>
      </select>
    </label>

    <div class="wcount" id="wcount"></div>
    <div class="wordgrid" id="wordgrid">
      ${ADJ.map(w => `
        <label data-w="${esc(w)}">
          <input type="checkbox" value="${esc(w)}"> ${esc(w)}
        </label>`).join('')}
    </div>

    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="button" id="submitBtn" disabled>Submit</button>`;

  updateWcount();

  $('#wordgrid').querySelectorAll('label').forEach(label => {
    label.addEventListener('click', ev => {
      ev.preventDefault();
      const w = label.dataset.w;
      if (selected.has(w)) selected.delete(w);
      else if (selected.size < MAX) selected.add(w);
      label.classList.toggle('on', selected.has(w));
      label.querySelector('input').checked = selected.has(w);
      updateWcount();
    });
  });

  $('#submitBtn').addEventListener('click', async () => {
    const btn = $('#submitBtn'), err = $('#err');
    btn.disabled = true;
    err.textContent = '';
    try {
      const res = await call('johariSubmitPeer', {
        payload: {
          sessionId: sessionId,
          relationship: $('#relationship').value,
          adjectives: [...selected]
        }
      });
      app.innerHTML = `
        <h1 class="page">Thank you</h1>
        <p class="lede">Your response has been recorded for ${esc(res.subjectFirstName || 'your colleague')}.</p>`;
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false;
    }
  });
}

boot();
</script>
</body>
</html>
