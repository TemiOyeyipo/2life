<!--
  Johari_Form.html
  Serve via HtmlService, same pattern as EQ_Form.html.
  One shared form handles both the participant's self-selection and
  each peer's rating, distinguished by a `mode` URL param:
    ?pid=123&pname=Jane&mode=self
    ?pid=123&pname=Jane&mode=peer&rater=Sam   (rater name optional — can prompt instead)
-->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; color: #222; }
    h1 { font-size: 20px; }
    p.intro { font-size: 13px; color: #555; }
    #raterNameField { margin-bottom: 16px; }
    #raterNameField input { font-size: 14px; padding: 6px; width: 100%; box-sizing: border-box; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 16px 0; }
    .word-grid label {
      display: flex; align-items: center; font-size: 13px;
      border: 1px solid #ddd; border-radius: 4px; padding: 6px 8px; cursor: pointer;
    }
    .word-grid label.checked { background: #4A6FA5; color: white; border-color: #4A6FA5; }
    .word-grid input { margin-right: 6px; }
    #counter { font-size: 13px; color: #555; margin-bottom: 10px; }
    #counter.over { color: #b3261e; font-weight: bold; }
    button { background: #4A6FA5; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #aaa; }
    #status { margin-top: 14px; font-size: 13px; }
  </style>
</head>
<body>
  <h1 id="heading">Johari Window</h1>
  <p class="intro" id="introText"></p>

  <div id="raterNameField" style="display:none;">
    <label for="raterName">Your name (so results can note who contributed):</label>
    <input type="text" id="raterName" placeholder="Your name">
  </div>

  <div id="counter">Choose 5–6 words: 0 selected</div>
  <div class="word-grid" id="wordGrid"></div>

  <button id="submitBtn" disabled>Submit</button>
  <div id="status"></div>

  <script>
    // Mirrors JOHARI_ADJECTIVES in SelfAwarenessSuite.gs — keep in sync.
    const JOHARI_ADJECTIVES = [
      'able','accepting','adaptable','bold','brave','calm','caring','cheerful',
      'clever','complex','confident','dependable','dignified','empathetic','energetic',
      'extroverted','friendly','giving','happy','helpful','idealistic','independent',
      'ingenious','intelligent','introverted','kind','knowledgeable','logical','loving',
      'mature','modest','nervous','observant','organized','patient','powerful',
      'proud','quiet','reflective','relaxed','religious','responsive','searching',
      'self-assertive','self-conscious','sensible','sentimental','shy','silly',
      'spontaneous','sympathetic','tense','trustworthy','warm','wise','witty'
    ];

    const MIN_WORDS = 5;
    const MAX_WORDS = 6;

    const params = new URLSearchParams(window.location.search);
    const participantId = params.get('pid') || '';
    const participantName = params.get('pname') || '';
    const mode = params.get('mode') === 'peer' ? 'peer' : 'self';
    let raterNamePrefill = params.get('rater') || '';

    const heading = document.getElementById('heading');
    const introText = document.getElementById('introText');
    const raterNameField = document.getElementById('raterNameField');
    const raterNameInput = document.getElementById('raterName');

    if (mode === 'self') {
      heading.textContent = 'Johari Window — Self Assessment';
      introText.textContent = `Choose ${MIN_WORDS}–${MAX_WORDS} words below that you feel best describe you.`;
    } else {
      heading.textContent = `Johari Window — Rating ${participantName || 'a colleague'}`;
      introText.textContent = `Choose ${MIN_WORDS}–${MAX_WORDS} words below that you feel best describe ${participantName || 'this person'}. Your individual answers stay private — only aggregated results are shared.`;
      raterNameField.style.display = 'block';
      raterNameInput.value = raterNamePrefill;
    }

    const grid = document.getElementById('wordGrid');
    const counter = document.getElementById('counter');
    const submitBtn = document.getElementById('submitBtn');

    function selectedWords() {
      return Array.from(grid.querySelectorAll('input:checked')).map(i => i.value);
    }

    function updateCounter() {
      const n = selectedWords().length;
      counter.textContent = `Choose ${MIN_WORDS}–${MAX_WORDS} words: ${n} selected`;
      counter.classList.toggle('over', n > MAX_WORDS);
      submitBtn.disabled = n < MIN_WORDS || n > MAX_WORDS;
    }

    JOHARI_ADJECTIVES.forEach(word => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = word;
      input.addEventListener('change', function() {
        label.classList.toggle('checked', input.checked);
        updateCounter();
      });
      label.appendChild(input);
      label.appendChild(document.createTextNode(word));
      grid.appendChild(label);
    });

    submitBtn.addEventListener('click', function() {
      submitBtn.disabled = true;
      const status = document.getElementById('status');
      status.textContent = 'Submitting...';

      const words = selectedWords();
      const payload = {
        action: mode === 'self' ? 'submitJohariSelf' : 'submitJohariPeer',
        participantId: participantId,
        participantName: participantName,
        words: words.join(',')
      };
      if (mode === 'peer') {
        payload.raterName = raterNameInput.value.trim() || 'Anonymous';
      }

      // Same note as EQ_Form.html: swap for a fetch() POST if this is
      // served from a deployed Web App URL rather than via HtmlService.
      google.script.run
        .withSuccessHandler(function() {
          status.textContent = 'Thank you — your response has been recorded.';
        })
        .withFailureHandler(function(err) {
          status.textContent = 'Something went wrong: ' + err.message;
          submitBtn.disabled = false;
        })
        .routeSelfAwarenessSuite({ parameter: payload });
    });
  </script>
</body>
</html>
