<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Strengths Compass</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#142033; --paper:#F2F4F7; --white:#fff; --line:#D3D9E1; --muted:#586477;
    --drive:#C1440E; --connection:#1F8A70; --insight:#2F6FE0; --influence:#7B4B94;
    --ui:'Bricolage Grotesque', system-ui, sans-serif;
    --read:'Source Serif 4', Georgia, serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5}
  h1,h2,h3{font-weight:800;line-height:1.15;margin:0;letter-spacing:-.02em}
  p{margin:0 0 1em}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:var(--white)}
  .logo{height:34px;width:auto;display:block}
  .link{background:none;border:0;padding:8px 0;text-decoration:underline;text-underline-offset:3px;font-weight:600;color:inherit}
  main{max-width:820px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,40px)}
  footer{max-width:820px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 40px;color:var(--muted);font-size:14px}

  .btn{display:inline-block;border:0;border-radius:999px;padding:14px 28px;font-weight:700;background:var(--ink);color:#fff;min-height:48px}
  .btn[disabled]{opacity:.35;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}

  h1.page{font-size:clamp(30px,5.5vw,46px);margin-bottom:12px}
  .lede{font-family:var(--read);font-size:19px;color:#2b3850;max-width:38em}

  form.stack{display:grid;gap:14px;margin-top:20px;max-width:460px}
  label{display:grid;gap:6px;font-weight:600;font-size:15px}
  input,select{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
  .fine{font-size:14px;color:var(--muted);margin:0}
  .err{color:#B3261E;font-weight:600;min-height:1.4em;margin:0}

  .center{text-align:center;padding:60px 0}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto 16px;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
  .prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
  .count{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:16px}

  .qrow{padding:16px 0;border-bottom:1px solid var(--line)}
  .qrow p{font-family:var(--read);font-size:18px;margin-bottom:10px}
  .scale{display:flex;gap:6px;flex-wrap:wrap}
  .opt{flex:1;min-width:56px;border:1.5px solid var(--line);border-radius:10px;padding:10px 4px;background:#fff;font-weight:700;font-size:13px;text-align:center;min-height:44px}
  .opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .scalehead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
  .nav{display:flex;justify-content:space-between;margin-top:26px;gap:12px}

  .idbox{display:inline-block;margin-top:8px;padding:10px 14px;border:1.5px dashed var(--muted);border-radius:10px;font-size:15px}
  .idbox b{font-size:18px;letter-spacing:.06em}

  .card{border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;background:#fff;border-top:8px solid var(--dc)}
  .card .rank{font-size:13px;font-weight:700;color:var(--muted)}
  .card h3{font-size:20px;margin:2px 0 2px}
  .card .dom{font-size:13px;font-weight:700;color:var(--dc)}
  .card p{font-family:var(--read);font-size:16px;margin-top:8px}
  .tip{font-size:14px;background:var(--paper);border-radius:10px;padding:10px 14px;margin-top:8px}
  .watch{font-size:13px;color:var(--muted);margin-top:6px}

  .bar{display:grid;grid-template-columns:120px 1fr 40px;gap:12px;align-items:center;font-weight:600;margin-bottom:10px}
  .track{height:14px;background:#E2E7ED;border-radius:8px;overflow:hidden}
  .track i{display:block;height:100%}

  .ranklist{width:100%;border-collapse:collapse;margin-top:8px}
  .ranklist td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
  .ranklist td.n{color:var(--muted);width:24px}
  .ranklist td.sc{text-align:right;color:var(--muted);width:60px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
</style>
</head>
<body>
<header class="top">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <svg class="logo" viewBox="0 0 540 120" role="img" aria-label="L'chaim: Nourishing Life &amp; Spirit">
      <g transform="translate(10, 0)">
        <path d="M 55 18 L 55 10 M 39 24 L 34 19 M 71 24 L 76 19 M 28 40 L 20 38 M 82 40 L 90 38"
              stroke="#D4A359" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
        <path d="M 30 65 A 28 28 0 1 1 80 65"
              fill="none" stroke="#2C3E35" stroke-width="3.8" stroke-linecap="round"/>
        <path d="M 55 38 C 36 55 32 78 55 94 C 78 78 74 55 55 38 Z" fill="#4A6B5D" opacity="0.95"/>
        <path d="M 55 94 C 50 81 50 65 55 54 C 60 65 60 81 55 94 Z" fill="#C87D55"/>
      </g>
      <text x="125" y="66" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="700" letter-spacing="2.8" fill="#2C3E35">L'chaim</text>
      <text x="127" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.5" fill="#C87D55" opacity="0.95">NOURISHING LIFE &amp; SPIRIT</text>
    </svg>
    <span style="width:1.5px;height:24px;background:var(--line)"></span>
    <span style="font-size:15px;color:var(--muted);font-weight:800">Strengths Compass</span>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <a class="link" href="index.html">Suite Home</a>
    <button class="link" id="findBtn" type="button">Reopen my result</button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer>
  Strengths Compass is an original reflection tool built for this portal. It is not affiliated with, or a
  reproduction of, any commercial strengths-assessment product. It reflects self-reported tendencies, not a
  clinical assessment.
</footer>

<script src="config.js"></script>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call = (fn, params) => fetch(CONFIG.API_URL, {
  method: 'POST',
  body: JSON.stringify({ fn, ...(params || {}) })
})
  .then(res => res.json())
  .then(data => {
    if (!data || !data.ok) throw new Error((data && data.error) || 'Something went wrong. Please try again.');
    return data.data;
  })
  .catch(err => { throw new Error(err.message || 'Could not reach the server. Please try again.'); });

const SCALE = [
  { v: 1, label: 'Strongly disagree' },
  { v: 2, label: 'Disagree' },
  { v: 3, label: 'Neutral' },
  { v: 4, label: 'Agree' },
  { v: 5, label: 'Strongly agree' }
];
const PAGE_SIZE = 8;
const state = { statements: [], page: 0, answers: {}, user: {}, creds: null };

function loading(text) {
  app.innerHTML = `<div class="center"><div class="spin"></div><p>${esc(text)}</p></div>`;
}

/* ---------- Intro ---------- */
function viewIntro(msg) {
  const u = state.user;
  app.innerHTML = `
    <h1 class="page">What are you naturally good at?</h1>
    <p class="lede">Rate 48 short statements about how you tend to operate. You'll get your top 5 Signature Strengths, a full ranked list of all 24 themes, and how they group into four domains: Drive, Connection, Insight, and Influence.</p>
    <form class="stack" id="startForm" novalidate>
      <label>Full name<input id="name" autocomplete="name" required value="${esc(u.name || '')}"></label>
      <label>Email<input id="email" type="email" autocomplete="email" required value="${esc(u.email || '')}"></label>
      <label>Role (optional)<input id="role" value="${esc(u.role || '')}"></label>
      <label>Team or group (optional)<input id="team" value="${esc(u.team || '')}"></label>
      <p class="fine">Takes about 10 minutes. Your name, email, team and answers are saved so you can reopen your report later.</p>
      <p class="err" id="err" role="alert">${esc(msg || '')}</p>
      <button class="btn" type="submit">Start Strengths Compass</button>
    </form>`;
  $('#startForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const name = $('#name').value.trim(), email = $('#email').value.trim();
    const role = $('#role').value.trim(), team = $('#team').value.trim();
    if (!name) return ($('#err').textContent = 'Enter your name to continue.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return ($('#err').textContent = 'Enter a valid email address.');
    state.user = { name, email, role, team };
    loading('Loading the statements');
    try {
      if (!state.statements.length) state.statements = await call('strengthsGetStatements');
      state.page = 0; state.answers = {};
      renderQuiz(true);
    } catch (e) { viewIntro(e.message); }
  });
}

/* ---------- Quiz ---------- */
function renderQuiz(scrollTop) {
  const total = state.statements.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  const start = state.page * PAGE_SIZE;
  const items = state.statements.slice(start, start + PAGE_SIZE);
  const answeredOnPage = items.every(s => state.answers[s.id] != null);
  const isLast = state.page === pages - 1;

  app.innerHTML = `
    <div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="${pages}" aria-valuenow="${state.page + 1}"><i style="width:${(state.page / pages) * 100}%"></i></div>
    <p class="count">Page ${state.page + 1} of ${pages}</p>
    <div class="scalehead"><span>Strongly disagree</span><span>Strongly agree</span></div>
    ${items.map(s => `
      <div class="qrow">
        <p>${esc(s.text)}</p>
        <div class="scale" data-id="${esc(s.id)}">
          ${SCALE.map(o => `<button type="button" class="opt ${state.answers[s.id] === o.v ? 'on' : ''}" data-v="${o.v}" aria-pressed="${state.answers[s.id] === o.v}" aria-label="${esc(o.label)}">${o.v}</button>`).join('')}
        </div>
      </div>`).join('')}
    <p class="err" id="err" role="alert"></p>
    <div class="nav">
      <button class="btn ghost" type="button" id="back" ${state.page === 0 ? 'disabled' : ''}>Back</button>
      <button class="btn" type="button" id="next" ${answeredOnPage ? '' : 'disabled'}>${isLast ? 'See my strengths' : 'Next'}</button>
    </div>`;
  if (scrollTop) window.scrollTo({ top: 0 });

  app.querySelectorAll('.scale').forEach(row => {
    row.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      state.answers[row.dataset.id] = Number(b.dataset.v);
      renderQuiz(false);
    }));
  });
  $('#back').addEventListener('click', () => { state.page--; renderQuiz(true); });
  $('#next').addEventListener('click', () => { isLast ? submit() : (state.page++, renderQuiz(true)); });
}

async function submit() {
  loading('Scoring your answers');
  try {
    const answers = state.statements.map(s => ({ id: s.id, value: state.answers[s.id] }));
    const report = await call('strengthsSaveResult', { payload: { ...state.user, answers } });
    state.creds = { id: report.id, email: state.user.email };
    viewResult(report);
  } catch (e) {
    state.page = Math.max(0, Math.ceil(state.statements.length / PAGE_SIZE) - 1);
    renderQuiz(true);
    const err = $('#err');
    if (err) err.textContent = e.message;
  }
}

/* ---------- Reopen ---------- */
function viewFind(msg) {
  app.innerHTML = `
    <h1 class="page">Reopen your report</h1>
    <p class="lede">Enter the result ID from your email, and the email address you used.</p>
    <form class="stack" id="findForm" novalidate>
      <label>Result ID<input id="rid" autocomplete="off" autocapitalize="characters" required></label>
      <label>Email<input id="remail" type="email" autocomplete="email" required></label>
      <p class="err" id="err" role="alert">${esc(msg || '')}</p>
      <div class="nav" style="margin-top:0">
        <button class="btn ghost" type="button" id="cancel">Back</button>
        <button class="btn" type="submit">Show my report</button>
      </div>
    </form>`;
  $('#cancel').addEventListener('click', () => viewIntro());
  $('#findForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const id = $('#rid').value, email = $('#remail').value;
    loading('Finding your report');
    try {
      const report = await call('strengthsGetResult', { id, email });
      state.creds = { id: report.id, email: email.trim() };
      viewResult(report);
    } catch (e) { viewFind(e.message); }
  });
}

/* ---------- Results ---------- */
function viewResult(r) {
  const first = String(r.name).split(' ')[0];
  const domainKeys = Object.keys(r.domains);

  app.innerHTML = `
    <h1 class="page">${esc(first)}'s Signature Strengths</h1>
    <p class="idbox">Result ID <b>${esc(r.id)}</b><br><span class="fine">Keep it. With your email, it reopens this report. Taken ${esc(r.date)}.</span></p>

    <h2 style="font-size:22px;margin:32px 0 14px">Your top 5</h2>
    ${r.top5.map((t, i) => `
      <div class="card" style="--dc:${r.domains[t.domain].color}">
        <div class="rank">#${i + 1}</div>
        <h3>${esc(t.name)}</h3>
        <div class="dom">${esc(r.domains[t.domain].name)}</div>
        <p>${esc(t.desc)}</p>
        <div class="tip"><b>Use it:</b> ${esc(t.tip)}</div>
        <div class="watch"><b>Watch for:</b> ${esc(t.watch)}</div>
      </div>`).join('')}

    <h2 style="font-size:22px;margin:32px 0 14px">Domain balance</h2>
    <p class="fine">How your energy splits across the four domains. Higher isn't better — it's just where more of your natural energy tends to sit.</p>
    ${domainKeys.map(k => `
      <div class="bar"><span>${esc(r.domains[k].name)}</span><div class="track"><i style="width:${r.domainPercents[k] || 0}%;background:${r.domains[k].color}"></i></div><b>${r.domainPercents[k] || 0}</b></div>`).join('')}
    ${domainKeys.map(k => `<p class="fine" style="margin-bottom:6px"><b style="color:${r.domains[k].color}">${esc(r.domains[k].name)}:</b> ${esc(r.domains[k].desc)}</p>`).join('')}

    <h2 style="font-size:22px;margin:32px 0 14px">All 24 themes, ranked</h2>
    <table class="ranklist">
      ${r.ranked.map((t, i) => `<tr><td class="n">${i + 1}</td><td><b>${esc(t.name)}</b> <span class="fine" style="display:inline">— ${esc(r.domains[t.domain].name)}</span></td><td class="sc">${t.score}/10</td></tr>`).join('')}
    </table>

    <p class="fine" style="margin-top:24px">${esc(r.disclaimer)}</p>
    <div class="actions">
      <button class="btn" type="button" id="pdf">Download PDF report</button>
      <button class="btn ghost" type="button" id="again">Take it again</button>
    </div>
    <p class="err" id="pdfErr" role="alert"></p>`;

  $('#pdf').addEventListener('click', async () => {
    const btn = $('#pdf'), err = $('#pdfErr');
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Preparing PDF';
    try {
      const f = await call('strengthsGetPdf', { id: state.creds.id, email: state.creds.email });
      const bytes = Uint8Array.from(atob(f.base64), ch => ch.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      const a = document.createElement('a');
      a.href = url; a.download = f.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Download PDF report';
    }
  });
  $('#again').addEventListener('click', () => { state.statements = []; viewIntro(); });
  window.scrollTo({ top: 0 });
}

$('#findBtn').addEventListener('click', () => viewFind());
viewIntro();
</script>
</body>
</html>
